<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <header>
            <h1>Let's get your life tracked</h1>
            <button id="theme-toggle">🌙</button>
        </header>

        <nav>
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="analytics">Analytics</button>
            <button class="tab-btn" data-tab="history">Logs</button>            
            <button class="tab-btn" data-tab="tasks">Tasks</button>
            <button class="tab-btn" data-tab="journal-history">Journal</button>
        </nav>

        <section id="dashboard" class="tab active">
            <div class="journal">
                <h2>How was your day</h2>
                <p id="prompt-text"></p>
                <textarea id="journal-input" placeholder="Write your thoughts..."></textarea>
                <button id="save-entry">Save Entry</button>
            </div>

            <div class="gratitude">
                <h2>Gratitude</h2>
                <input 
                    type="text" 
                    id="gratitude-input" 
                    placeholder="One thing you’re grateful for today..."
                />
                <button id="save-gratitude">Gratify</button>
            </div>

            <div class="right-panel">

                <div class="habits">
                    <h2>Habits</h2>
                    <div id="habit-list"></div>
                </div>

                <div class="health">
                    <h2>Water Intake</h2>
                    <div class="water">
                        <div class="glasses">
                            <div class="glass" data-index="1"></div>
                            <div class="glass" data-index="2"></div>
                            <div class="glass" data-index="3"></div>
                            <div class="glass" data-index="4"></div>
                            <div class="glass" data-index="5"></div>
                            <div class="glass" data-index="6"></div>
                            <div class="glass" data-index="7"></div>
                            <div class="glass" data-index="8"></div>
                        </div>
                    </div>
                </div>

                <div class="mood">
                    <h2 id="mood-heading">How are you feeling today?</h2>
                    <div class="mood-options">
                        <button class="mood-btn" data-mood="happy">😄</button>
                        <button class="mood-btn" data-mood="good">🙂</button>
                        <button class="mood-btn" data-mood="neutral">😐</button>
                        <button class="mood-btn" data-mood="sad">😔</button>
                        <button class="mood-btn" data-mood="angry">😡</button>
                    </div>
                    <p id="mood-quote"></p>
                </div>
            </div>
        </section>

        <section id="analytics" class="tab">
            <select id="month-select">
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>

            <div class="analytics-container">
                <div class="card">
                    <h2>Today's progress</h2>
                    <p id = "summary-text">Your daily data stats will appear here...</p>
                </div>
            </div>

            <div class="chart-section">
                <h2>Monthly Habit Progress</h2>
                <canvas id="habitChart"></canvas>
            </div>

            <div class="chart-section">
                <h2>Mood Distribution</h2>
                <canvas id="moodChart"></canvas>
            </div>
        </section>

        <div id="history" class="tab">
            <div class="logs-card">
                <h3>Habit Tracker</h3>

                <!-- Scroll wrapper -->
                <div id="habit-tracker-container">
                    <table id="habit-tracker"></table>
                </div>
            </div>
        </div>

        <section id="tasks" class="tab">
            <div class="heatmap-box">
                <div id="heatmap-container">
                    <h3>Activity</h3>
                    <div id="heatmap"></div>
                </div>
            </div>

            <div id="streak-stats">
                <p id="current-streak"></p>
                <p id="best-streak"></p>
            </div>

            <div class="tasks-card">
                <h3>Tasks</h3>

                <div class="task-input">
                    <input type="text" id="task-input" placeholder="Add a task...">
                    <button id="add-task">Add</button>
                </div>

                <div class="task-list-container">
                    <div id="task-list"></div>
                </div>
            </div>
        </section>

        <section id="journal-history" class="tab">
            <div class="journal-history-card">
                <h3>Journal History</h3>
                <input type="date" id="journal-date-picker">
                <div id="journal-display">
                    
                </div>
            </div>
        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
